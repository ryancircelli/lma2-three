<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Living Marine Aquarium 2</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b3a52; color: #d8eef8; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    #view { display: block; width: 100vw; height: 100vh; }
    #panel {
      position: fixed; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 10px 12px; max-width: calc(100vw - 48px);
      background: rgba(4, 22, 34, 0.72); border: 1px solid rgba(160, 210, 240, 0.18); border-radius: 8px;
    }
    #panel select { font: inherit; }
    #panel a { color: #9fd8ff; text-decoration: none; }
    #panel a:hover { text-decoration: underline; }
    #info { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; background: rgba(4, 22, 34, 0.72); border-radius: 6px; }
    #info.error { color: #ffb4a8; }
    /* ?clean=1 - nothing but the canvas, for reference comparisons */
    body.clean #panel, body.clean #info { display: none; }
    body.saver, body.saver #view { cursor: none; }
    /* The hidden attribute must beat any display rule (e.g. the picker's flex). */
    [hidden] { display: none !important; }
    /* Fish picker (fishpicker.ts) */
    #fishpicker {
      position: fixed; z-index: 2; width: min(340px, calc(100vw - 24px)); max-height: calc(100vh - 90px);
      display: flex; flex-direction: column; gap: 8px; padding: 10px 12px;
      background: rgba(4, 22, 34, 0.92); border: 1px solid rgba(160, 210, 240, 0.18); border-radius: 8px;
    }
    #fishpicker .fp-head { display: flex; justify-content: space-between; align-items: center; }
    #fishpicker .fp-close { font-size: 18px; line-height: 1; width: 1.6em; height: 1.6em; padding: 0; }
    #fishpicker .fp-presets, #fishpicker .fp-foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #fishpicker .fp-foot { justify-content: space-between; }
    #fishpicker .fp-list { overflow-y: auto; display: grid; gap: 2px; padding-right: 4px; }
    #fishpicker .fp-row { display: grid; grid-template-columns: 1fr auto 3.6em auto; gap: 4px; align-items: center; }
    #fishpicker .fp-row input { width: 100%; font: inherit; text-align: right; }
    #fishpicker .fp-row button { width: 1.8em; }
    #fishpicker .fp-apply.dirty { font-weight: 600; }
    #panel button.active { outline: 1px solid rgba(160, 210, 240, 0.6); }
    body.clean #fishpicker, body.idle #fishpicker { display: none; }
    /* Fullscreen with no recent mouse movement (main.ts): screensaver look */
    body.idle #panel, body.idle #info { opacity: 0; pointer-events: none; }
    body.idle, body.idle #view { cursor: none; }
    #panel, #info { transition: opacity 0.4s; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel"></div>
  <div id="info">Loading&hellip;</div>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
