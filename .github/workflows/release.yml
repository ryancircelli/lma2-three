name: Screensaver release

# Builds the Windows screensaver (screensaver/) with the current site embedded
# and publishes it as a GitHub Release, so this URL always serves the newest:
#   https://github.com/ryancircelli/lma2-three/releases/latest/download/LMA2-Aquarium.scr

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "assets/**"
      - "screensaver/**"
      - "tools/stage.ts"
      - "deno.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  screensaver:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build and stage the site
        run: |
          deno task build
          deno task stage

      - name: Embed the site
        shell: pwsh
        run: Compress-Archive -Path _site/* -DestinationPath screensaver/site.zip -CompressionLevel Optimal

      - name: Build the screensaver
        run: dotnet build screensaver/LMA2Screensaver.csproj -c Release -p:Version=${{ env.VERSION }}

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item screensaver/bin/Release/net48/LMA2.exe out/LMA2-Aquarium.scr
          "{0:N1} MB" -f ((Get-Item out/LMA2-Aquarium.scr).Length / 1MB)

      # Loads the tank off-screen and captures a frame. Hosted runners have no
      # GPU, so WebGL may be unavailable here: informative, not a gate.
      - name: Self-test (informative)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process screensaver/bin/Release/net48/LMA2.exe -ArgumentList '/selftest', "$PWD/selftest" -PassThru -Wait
          Get-Content selftest/status.json -ErrorAction SilentlyContinue
          "exit $($p.ExitCode)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screensaver-${{ env.VERSION }}
          path: |
            out/LMA2-Aquarium.scr
            selftest/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          Living Marine Aquarium 2, rebuilt in three.js, as a Windows screensaver (Windows 10/11).

          **Install:** download ``LMA2-Aquarium.scr``, double-click it, and press **Install as my screensaver**.
          Windows SmartScreen may warn because the file isn't code-signed: choose *More info* > *Run anyway*.

          Settings: scene, widescreen mode (fit / fill / stretch), speed, fish, schooling, sound, all monitors.
          Built from ${{ github.sha }}. Live version: https://lma2.ryancircelli.com
          "@
          gh release create "v$env:VERSION" out/LMA2-Aquarium.scr --title "Screensaver $env:VERSION" --notes $notes --latest

      - name: Keep the 5 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $old = gh release list --limit 100 --json tagName,createdAt | ConvertFrom-Json | Sort-Object createdAt -Descending | Select-Object -Skip 5
          foreach ($r in $old) { gh release delete $r.tagName --yes --cleanup-tag }
